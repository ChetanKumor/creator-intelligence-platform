[project]
name = "creator-reference-analyzer"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "scenedetect==0.6.7.1",
  "opencv-python-headless==4.12.0.88",
  "numpy==2.2.6",
  "pillow==11.3.0",
  "torch==2.8.0+cpu",
  "transformers==4.57.1",
  "jsonschema==4.25.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
